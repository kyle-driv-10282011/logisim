version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: vehicle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: vehicle_sim
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "5432:5432"

    networks:
      - simulator-net


  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
        NO_PROXY: ${NO_PROXY:-}

    container_name: vehicle-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://simulator:simulator_password@postgres:5432/vehicle_sim

      # Routing service
      ROUTING_URL: https://router.project-osrm.org

      # Outbound calls (geocoding/routing) go through this proxy, which
      # reaches the internet directly rather than through Zscaler's
      # TLS-inspecting path - overridable per machine via a real
      # HTTP_PROXY/HTTPS_PROXY env var or a .env file next to this file.
      HTTP_PROXY: ${HTTP_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
      NO_PROXY: ${NO_PROXY:-postgres,localhost,127.0.0.1}

    depends_on:
      - postgres

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app

    networks:
      - simulator-net


  frontend:
    build:
      context: ./frontend

    container_name: vehicle-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8700:80"

    networks:
      - simulator-net


volumes:

  postgres_data:


networks:

  simulator-net:
    driver: bridge