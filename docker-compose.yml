#
# Reached only through the Edge stack (~/Code/Edge): its Traefik serves
# https://logisim.kjfries.com and forwards to the frontend's nginx over
# "edge-logisim", a network shared with Traefik alone. nginx serves the page
# and passes /api/ on to the backend, and refuses any request without
# Traefik's PROXY_SECRET. Nothing here publishes a port.
#
# Start Edge first (it creates edge-logisim), then:
#   PROXY_SECRET in .env next to this file (= LOGISIM_PROXY_SECRET in Edge's)
#   docker compose up -d --build
#

services:

  postgres:
    image: postgres:16
    container_name: vehicle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: vehicle_sim
      POSTGRES_USER: simulator
      POSTGRES_PASSWORD: simulator_password

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    # No published port: use `docker compose exec postgres psql -U simulator -d vehicle_sim`.
    networks:
      - simulator-net


  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
        NO_PROXY: ${NO_PROXY:-}

    container_name: vehicle-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://simulator:simulator_password@postgres:5432/vehicle_sim

      # Routing service
      ROUTING_URL: https://router.project-osrm.org

      # Outbound calls (geocoding/routing) go through this proxy, which
      # reaches the internet directly rather than through Zscaler's
      # TLS-inspecting path - overridable per machine via a real
      # HTTP_PROXY/HTTPS_PROXY env var or a .env file next to this file.
      HTTP_PROXY: ${HTTP_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://us08dv2itm94.pmdomhq.protomold.com:8090}
      NO_PROXY: ${NO_PROXY:-postgres,localhost,127.0.0.1}

    depends_on:
      - postgres

    # No published port: the frontend's nginx reaches it as backend:5000.

    volumes:
      - ./backend:/app

    networks:
      - simulator-net


  frontend:
    build:
      context: ./frontend

    container_name: vehicle-frontend
    restart: unless-stopped

    environment:
      # Proof a request came through Edge (frontend/nginx.conf.template).
      PROXY_SECRET: ${PROXY_SECRET:?set PROXY_SECRET in .env (the same as LOGISIM_PROXY_SECRET in the Edge stack's .env)}

    depends_on:
      - backend

    networks:
      - simulator-net # backend
      - edge-logisim


volumes:

  postgres_data:


networks:

  simulator-net:
    driver: bridge

  # Shared with Edge's Traefik only (Edge creates it): start Edge first.
  edge-logisim:
    external: true
