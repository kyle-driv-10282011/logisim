services:
  db:
    image: postgres:16-alpine
    container_name: logistics-postgres
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: logistics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logistics -d logistics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: logistics-backend
    environment:
      DATABASE_URL: postgresql://logistics:logistics@db:5432/logistics
      PYTHONPATH: /app/backend
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: logistics-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
