<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Simulator</title>

    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet" />

    <link rel="stylesheet" href="styles.css">

    <style>
        #app {
            display: flex;
            height: 100vh;
        }

        #main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #map {
            flex: 1;
        }

        #sim-clock {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.35);
            font-size: 13px;
            line-height: 1.4;
        }

        #time-multiplier-control {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            font-size: 11px;
            color: #555;
        }

        #time-multiplier-input {
            width: 55px;
        }

        #time-multiplier-control button {
            font-size: 11px;
            padding: 1px 6px;
        }

        .rush-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 11px;
            background: #e03131;
            color: white;
        }

        .gas-badge {
            display: inline-block;
            margin-left: 6px;
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 11px;
            background: #f08c00;
            color: white;
        }

        #vehicle-panel {
            width: 280px;
            flex-shrink: 0;
            box-sizing: border-box;
            padding: 10px;
            border-left: 1px solid #ccc;
            overflow-y: auto;
        }

        #vehicle-panel input,
        #vehicle-panel select {
            width: 100%;
            box-sizing: border-box;
        }

        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 6px 2px;
            font-size: 11px;
            border: 1px solid #ccc;
            background: #f0f0f0;
            cursor: pointer;
        }

        .tab-button.active {
            background: #3388ff;
            border-color: #3388ff;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .vehicle-row {
            cursor: default;
        }

        .vehicle-row:hover {
            background: white;
        }

        .vehicle-row.clickable {
            cursor: pointer;
        }

        .vehicle-row.clickable:hover {
            background: #f5f5f5;
        }

        .sell-button,
        .remove-path-button {
            font-size: 11px;
            padding: 2px 8px;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            color: white;
        }

        .status-READY {
            background: #888;
        }

        .status-DRIVING {
            background: #2a8f2a;
        }

        .status-SOLD {
            background: #555;
        }

        #vehicle-details {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 14px;
        }

        #zone-editor {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 13px;
        }

        .path-distance {
            font-size: 11px;
            color: #555;
        }

        #zone-editor label {
            display: block;
            font-size: 11px;
            color: #555;
            margin-top: 6px;
        }

        #speed-legend {
            font-size: 11px;
            color: #555;
            margin-bottom: 10px;
        }

        .legend-swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin: 0 3px 0 8px;
            vertical-align: middle;
        }

        #zone-range-label {
            font-weight: bold;
            font-size: 12px;
        }

        #zone-draw-hint {
            font-size: 12px;
            color: #555;
            margin: 6px 0;
        }

        #path-select-hint {
            font-size: 12px;
            color: #555;
            margin: 2px 0 6px;
        }
    </style>
</head>

<body>

<div id="app">

<div id="main">
    <div id="map"></div>
    <div id="sim-clock">
        <div id="sim-clock-text"></div>
        <div id="time-multiplier-control">
            <label for="time-multiplier-input">Time x</label>
            <input id="time-multiplier-input" type="number" min="0.1" step="1">
            <button id="time-multiplier-set-button" onclick="withSpinner(this, setTimeMultiplier)">Set</button>
        </div>
    </div>
</div>

<div id="vehicle-panel">

    <div class="tab-bar">
        <a class="tab-button" href="templates.html" style="text-decoration:none;color:inherit;text-align:center;">Templates</a>
        <button class="tab-button" id="tab-button-places" onclick="withSpinner(this, () => showTab('places'))">Places</button>
        <button class="tab-button active" id="tab-button-myvehicles" onclick="withSpinner(this, () => showTab('myvehicles'))">My Vehicles</button>
        <button class="tab-button" id="tab-button-allvehicles" onclick="withSpinner(this, () => showTab('allvehicles'))">All Vehicles</button>
        <button class="tab-button" id="tab-button-paths" onclick="withSpinner(this, () => showTab('paths'))">Paths</button>
        <button class="tab-button" id="tab-button-inroute" onclick="withSpinner(this, () => showTab('inroute'))">In Route</button>
    </div>

    <!--
        Shared by every free-text location box (vehicle starting location,
        path origin/destination) - suggests previously-saved places without
        forcing a dropdown, so typing a brand-new description still works.
    -->
    <datalist id="places-list"></datalist>

    <div class="tab-content" id="tab-places">

        <b>Places</b>
        <div id="place-list"></div>

        <div class="panel-form">
            <input id="place-description" placeholder="A description (Target near Minneapolis) or an address">
            <button onclick="withSpinner(this, addPlace)">Add Place</button>
        </div>

    </div>

    <div class="tab-content active" id="tab-myvehicles">

        <div class="panel-form">
            <select id="vehicle-spec-select"></select>
            <input id="vehicle-location" list="places-list" placeholder="A description (Target near Minneapolis) or an address" value="Minneapolis">
            <input id="vehicle-starting-mileage" type="number" min="0" step="1" placeholder="Starting mileage" value="0">
            <button onclick="withSpinner(this, addVehicle)">Add Vehicle</button>
        </div>

        <div id="vehicle-list"></div>

        <div class="panel-form">
            <select id="path-select" onchange="updateStartTripVisibility()">
                <option value="">Select a path...</option>
            </select>
            <div id="path-select-hint" style="display:none"></div>
            <button id="start-trip-button" onclick="withSpinner(this, startTrip)" style="display:none">Start Trip</button>
        </div>

    </div>

    <div class="tab-content" id="tab-allvehicles">

        <b>All Vehicles</b>
        <div id="all-vehicle-list"></div>

    </div>

    <div class="tab-content" id="tab-paths">

        <div class="panel-form">
            <input id="origin" list="places-list" placeholder="Origin" value="Minneapolis">
            <button id="swap-origin-destination-button" onclick="withSpinner(this, swapOriginDestination)" title="Swap origin and destination">&#8645; Swap</button>
            <input id="destination" list="places-list" placeholder="Destination" value="Chicago">
            <button onclick="withSpinner(this, createPath)">Create Path</button>
        </div>

        <div id="path-list"></div>

        <div id="zone-editor" style="display:none">

            <div id="speed-legend">
                Speed limit:
                <span class="legend-swatch" style="background:#e03131"></span>&lt;45
                <span class="legend-swatch" style="background:#f08c00"></span>45-64
                <span class="legend-swatch" style="background:#2f9e44"></span>65+
                <br>Custom zones are outlined in black. Click any section of the
                route to edit it, or draw a custom one below.
            </div>

            <b>Zones on <span id="zone-editor-path-label"></span></b>

            <div id="zone-list"></div>

            <button id="draw-zone-button" onclick="withSpinner(this, startZoneDraw)">Draw a custom zone</button>

            <div id="zone-draw-hint" style="display:none">
                Click the start point, then the end point, of the road chunk on the map.
            </div>

            <div id="zone-form" class="panel-form" style="display:none">

                <div id="zone-range-label"></div>

                <label>Speed limit (mph)</label>
                <input id="zone-speed" type="number" min="1" value="35">

                <label>Rush hour start (0-24, blank = no rush hour)</label>
                <input id="zone-rush-start" type="number" min="0" max="24" step="0.5" placeholder="e.g. 7">

                <label>Rush hour end (0-24)</label>
                <input id="zone-rush-end" type="number" min="0" max="24" step="0.5" placeholder="e.g. 9">

                <label>Rush hour severity (0-1, lower = worse)</label>
                <input id="zone-rush-factor" type="number" min="0" max="1" step="0.05" value="0.6">

                <button onclick="withSpinner(this, saveZone)">Save</button>
                <button onclick="withSpinner(this, cancelZoneForm)">Cancel</button>
                <button id="zone-delete-button" onclick="withSpinner(this, deleteSelectedZone)" style="display:none">Delete Zone</button>

            </div>

        </div>

    </div>

    <div class="tab-content" id="tab-inroute">

        <div id="inroute-list"></div>
        <div id="vehicle-details">Select a vehicle to see details.</div>

    </div>

</div>

</div>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
