<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Simulator</title>

    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet" />

    <style>
        body {
            margin:0;
            font-family: Arial;
        }

        #controls {
            padding:10px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        #map {
            height:88vh;
        }

        input {
            width:160px;
        }

        fieldset {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

<body>

<div id="controls">

    <fieldset>
        <legend>Vehicles</legend>

        <input id="vehicle-name" placeholder="Name" value="Truck 1">
        <input id="vehicle-type" placeholder="Type" value="truck">
        <button onclick="addVehicle()">Add Vehicle</button>

        <select id="vehicle-select"></select>
    </fieldset>

    <fieldset>
        <legend>Paths</legend>

        <input id="path-name" placeholder="Path name" value="Minneapolis to Chicago">
        Origin: <input id="origin" value="Minneapolis">
        Destination: <input id="destination" value="Chicago">
        <button onclick="createPath()">Create Path</button>

        <select id="path-select"></select>
    </fieldset>

    <fieldset>
        <legend>Trip</legend>

        <button onclick="startTrip()">Start Trip</button>
    </fieldset>

</div>


<div id="map"></div>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
