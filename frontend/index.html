<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Simulator</title>

    <link
      href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css"
      rel="stylesheet" />

    <style>
        body {
            margin:0;
            font-family: Arial;
        }

        #app {
            display: flex;
            height: 100vh;
        }

        #main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        #map {
            flex: 1;
        }

        #vehicle-panel {
            width: 280px;
            flex-shrink: 0;
            box-sizing: border-box;
            padding: 10px;
            border-left: 1px solid #ccc;
            overflow-y: auto;
        }

        #vehicle-panel input,
        #vehicle-panel select {
            width: 100%;
            box-sizing: border-box;
        }

        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
        }

        .tab-button {
            flex: 1;
            padding: 6px 4px;
            font-size: 13px;
            border: 1px solid #ccc;
            background: #f0f0f0;
            cursor: pointer;
        }

        .tab-button.active {
            background: #3388ff;
            border-color: #3388ff;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .panel-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .vehicle-item {
            padding: 8px;
            margin-bottom: 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }

        .vehicle-item:hover {
            background: #f5f5f5;
        }

        .list-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .vehicle-row {
            cursor: default;
        }

        .vehicle-row:hover {
            background: white;
        }

        .vehicle-row.clickable {
            cursor: pointer;
        }

        .vehicle-row.clickable:hover {
            background: #f5f5f5;
        }

        .sell-button,
        .remove-path-button {
            font-size: 11px;
            padding: 2px 8px;
        }

        .vehicle-item.selected {
            border-color: #3388ff;
            background: #eaf2ff;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 10px;
            color: white;
        }

        .status-READY {
            background: #888;
        }

        .status-DRIVING {
            background: #2a8f2a;
        }

        #vehicle-details {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 14px;
        }

        #zone-editor {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 13px;
        }

        #zone-editor label {
            display: block;
            font-size: 11px;
            color: #555;
            margin-top: 6px;
        }

        #speed-legend {
            font-size: 11px;
            color: #555;
            margin-bottom: 10px;
        }

        .legend-swatch {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin: 0 3px 0 8px;
            vertical-align: middle;
        }

        #zone-range-label {
            font-weight: bold;
            font-size: 12px;
        }

        #zone-draw-hint {
            font-size: 12px;
            color: #555;
            margin: 6px 0;
        }
    </style>
</head>

<body>

<div id="app">

<div id="main">
    <div id="map"></div>
</div>

<div id="vehicle-panel">

    <div class="tab-bar">
        <button class="tab-button active" id="tab-button-vehicles" onclick="showTab('vehicles')">Vehicles</button>
        <button class="tab-button" id="tab-button-paths" onclick="showTab('paths')">Paths</button>
        <button class="tab-button" id="tab-button-inroute" onclick="showTab('inroute')">In Route</button>
    </div>

    <div class="tab-content active" id="tab-vehicles">

        <div class="panel-form">
            <input id="vehicle-name" placeholder="Name" value="Truck 1">
            <input id="vehicle-type" placeholder="Type" value="truck">
            <button onclick="addVehicle()">Add Vehicle</button>
        </div>

        <div id="vehicle-list"></div>

        <div class="panel-form">
            <select id="path-select" onchange="updateStartTripVisibility()">
                <option value="">Select a path...</option>
            </select>
            <button id="start-trip-button" onclick="startTrip()" style="display:none">Start Trip</button>
        </div>

    </div>

    <div class="tab-content" id="tab-paths">

        <div class="panel-form">
            <input id="origin" placeholder="Origin" value="Minneapolis">
            <input id="destination" placeholder="Destination" value="Chicago">
            <button onclick="createPath()">Create Path</button>
        </div>

        <div id="path-list"></div>

        <div id="zone-editor" style="display:none">

            <div id="speed-legend">
                Speed limit:
                <span class="legend-swatch" style="background:#e03131"></span>&lt;45
                <span class="legend-swatch" style="background:#f08c00"></span>45-64
                <span class="legend-swatch" style="background:#2f9e44"></span>65+
                <br>Custom zones are outlined in black. Click any section of the
                route to edit it, or draw a custom one below.
            </div>

            <b>Zones on <span id="zone-editor-path-label"></span></b>

            <div id="zone-list"></div>

            <button id="draw-zone-button" onclick="startZoneDraw()">Draw a custom zone</button>

            <div id="zone-draw-hint" style="display:none">
                Click the start point, then the end point, of the road chunk on the map.
            </div>

            <div id="zone-form" class="panel-form" style="display:none">

                <div id="zone-range-label"></div>

                <label>Speed limit (mph)</label>
                <input id="zone-speed" type="number" min="1" value="35">

                <label>Rush hour start (0-24, blank = no rush hour)</label>
                <input id="zone-rush-start" type="number" min="0" max="24" step="0.5" placeholder="e.g. 7">

                <label>Rush hour end (0-24)</label>
                <input id="zone-rush-end" type="number" min="0" max="24" step="0.5" placeholder="e.g. 9">

                <label>Rush hour severity (0-1, lower = worse)</label>
                <input id="zone-rush-factor" type="number" min="0" max="1" step="0.05" value="0.6">

                <button onclick="saveZone()">Save</button>
                <button onclick="cancelZoneForm()">Cancel</button>
                <button id="zone-delete-button" onclick="deleteSelectedZone()" style="display:none">Delete Zone</button>

            </div>

        </div>

    </div>

    <div class="tab-content" id="tab-inroute">

        <div id="inroute-list"></div>
        <div id="vehicle-details">Select a vehicle to see details.</div>

    </div>

</div>

</div>


<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
