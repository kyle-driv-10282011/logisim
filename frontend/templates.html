<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Templates</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            padding: 16px 20px;
            max-width: 480px;
        }

        #back-link {
            display: inline-block;
            margin-bottom: 16px;
            font-size: 13px;
        }

        #spec-editor {
            margin-top: 16px;
            padding-top: 10px;
            border-top: 1px solid #ccc;
            font-size: 13px;
        }

        #spec-editor label {
            display: block;
            font-size: 11px;
            color: #555;
            margin-top: 6px;
        }

        #spec-editor input {
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

<a id="back-link" href="index.html">&larr; Back to Vehicle Simulator</a>

<div id="spec-editor">

    <b>Vehicle Templates</b>

    <div id="spec-list"></div>

    <div class="panel-form">
        <label for="spec-year">Year</label>
        <input id="spec-year" type="number" placeholder="Year" value="2026">

        <label for="spec-brand">Brand</label>
        <input id="spec-brand" placeholder="Brand" value="Chevy">

        <label for="spec-model">Model</label>
        <input id="spec-model" placeholder="Model" value="Express">

        <label for="spec-person-capacity">Person capacity</label>
        <input id="spec-person-capacity" type="number" min="1" placeholder="Person capacity" value="2">

        <label for="spec-cargo-capacity">Cargo capacity (cu ft)</label>
        <input id="spec-cargo-capacity" type="number" min="0" step="0.1" placeholder="Cargo capacity (cu ft)" value="240">

        <label for="spec-cost">Cost ($)</label>
        <input id="spec-cost" type="number" min="0" step="0.01" placeholder="Cost ($)" value="45000">

        <label for="spec-mpg">MPG</label>
        <input id="spec-mpg" type="number" min="0" step="0.1" placeholder="MPG" value="18">

        <label for="spec-image">Image filename (frontend/images/...)</label>
        <input id="spec-image" placeholder="Image filename (frontend/images/...)" value="2026-Chevy-Express.png">

        <button onclick="withSpinner(this, addSpec)">Add Template</button>
    </div>

</div>

<script src="templates.js"></script>

</body>
</html>
